name: Build

on:
  push:
    branches: [main]
    tags: ['*', '!latest-dev']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-screenshots:
    name: Unit tests & README screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :composeApp:desktopTest --console=plain
      - name: Render screenshots
        run: ./gradlew :composeApp:run --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
      - name: Commit updated screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Version code always increases, so each APK installs over the previous one.
          echo "TIDES_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TIDES_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "TIDES_VERSION_NAME=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "TIDES_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "TIDES_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TIDES_KEY_ALIAS=$KEY_ALIAS"
              echo "TIDES_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; using a throwaway debug signing key, so this APK won't install over earlier builds."
          fi
      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: tides-android
          path: composeApp/build/outputs/apk/release/*.apk
      - name: Publish latest-dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk="tides-dev-${short_sha}.apk"
          cp composeApp/build/outputs/apk/release/*.apk "$apk"
          # Replace the rolling release so the tag always points at the newest main commit.
          gh release delete latest-dev --cleanup-tag --yes || true
          gh release create latest-dev "$apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest dev build (${short_sha})" \
            --notes "APK built automatically from \`main\` at ${GITHUB_SHA} (version ${TIDES_VERSION_NAME}). Not a stable release."
      - name: Publish tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          apk="tides-${tag}.apk"
          cp composeApp/build/outputs/apk/release/*.apk "$apk"
          # Create the release if it doesn't exist yet, then attach (or replace) the APK.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          gh release upload "$tag" "$apk" --clobber

  ios:
    name: iOS app (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build for simulator
        working-directory: iosApp
        run: |
          set +e
          xcodebuild -version
          xcodebuild -list -project iosApp.xcodeproj 2>&1 | tee xcodebuild.log
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface errors as annotations so they are visible without downloading logs.
            { grep -E "\.kt:[0-9]+:[0-9]+: error:|\.swift:[0-9]+:[0-9]+: error:" xcodebuild.log | sort -u | head -9; grep -m1 "What went wrong" xcodebuild.log; } | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: tides-ios-simulator
          path: iosApp/build/Build/Products/Debug-iphonesimulator/Tides.app
